# Render Blueprint — runs the full site (pages + contact form) from this GitHub repo.
# Render dashboard → New → Blueprint → pick this repository.
# Render asks for SMTP_PASS (the Gmail App Password) when you create it; it is never stored in GitHub.
services:
  - type: web
    name: abhinav-kunwar-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MAIL_TO
        value: kunwarabhi7320@gmail.com
      - key: SMTP_USER
        value: kunwarabhi7320@gmail.com
      - key: SMTP_PASS
        sync: false
      # Sanity CMS — paste your project ID in Render → Environment (it is a public ID, not a secret).
      - key: SANITY_PROJECT_ID
        sync: false
      - key: SANITY_DATASET
        value: production
      - key: SANITY_API_VERSION
        value: "2025-02-19"
      - key: SANITY_CACHE_SECONDS
        value: "60"
